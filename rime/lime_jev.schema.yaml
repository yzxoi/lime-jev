schema:
  schema_id: lime_jev
  name: "Lime · 本地语境"
  version: "0.1.0"
  author: ["lime-jev contributors", "xushengfeng (lime)"]
  dependencies: [luna_pinyin]
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]
  - name: simplification
    reset: 1
    states: [繁體, 简体]
engine:
  processors:
    - lua_processor@*lime_jev*processor
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors: [ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators:
    - lua_translator@*lime_jev*translator
    - script_translator
    - punct_translator
  filters: [simplifier, uniquifier]
simplifier:
  option_name: simplification
  opencc_config: t2s.json
  tips: none
translator:
  dictionary: luna_pinyin
  prism: lime_jev
  enable_sentence: true
  enable_user_dict: true
  preedit_format:
    - "xform/([nl])v/$1ü/"
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
punctuator:
  import_preset: default
key_binder:
  import_preset: default
recognizer:
  import_preset: default
menu:
  page_size: 5
